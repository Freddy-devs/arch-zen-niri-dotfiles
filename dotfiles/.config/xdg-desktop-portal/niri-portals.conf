# Portales de niri. Igual que /usr/share/xdg-desktop-portal/niri-portals.conf, salvo la captura:
# el Screenshot de gnome en niri solo funciona con UNA pantalla ("outputs.len() == 1"), así que
# flameshot fallaba con dos monitores. xdg-desktop-portal-wlr captura todas con wlr-screencopy.
# Compartir pantalla (ScreenCast) sigue con gnome, que en niri sí funciona.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.Screenshot=wlr;
