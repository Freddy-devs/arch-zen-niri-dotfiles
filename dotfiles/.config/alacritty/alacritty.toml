# Alacritty — Nord (misma paleta que la barra y fastfetch)
# Corre como un solo proceso (alacritty --daemon desde niri); cada ventana nueva es
# "alacritty msg create-window", que comparte GPU, fuentes y librerías: ~10 MB por ventana
# en lugar de ~50 MB por proceso.
[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.96
decorations = "None"
title = "Terminal"
dynamic_title = true

[scrolling]
history = 5000
multiplier = 3

[font]
size = 11.5
offset = { x = 0, y = 3 }
builtin_box_drawing = true
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
# deja de parpadear (y de redibujar) a los 5 s sin escribir
blink_timeout = 5
thickness = 0.2
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    # zen-clip pega con Shift+Insert
    { key = "Insert", mods = "Shift", action = "Paste" },
    { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
    { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
    # Shift+Enter = nueva línea en Claude Code
    { key = "Return", mods = "Shift", chars = "\u001B\r" },
]

# ---------- Nord ----------
[colors.primary]
background = "#242933"
foreground = "#eceff4"

[colors.cursor]
text = "#242933"
cursor = "#eceff4"

[colors.selection]
text = "#eceff4"
background = "#4c566a"

[colors.search.matches]
foreground = "#242933"
background = "#ebcb8b"

[colors.search.focused_match]
foreground = "#242933"
background = "#a3be8c"

[colors.normal]
black = "#1e222a"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#88c0d0"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#d8dee9"

[colors.bright]
black = "#434c5e"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
