# arch-zen-niri — privacidad de red (NetworkManager)
[device]
# MAC aleatoria al buscar redes Wi-Fi
wifi.scan-rand-mac-address = yes

[connection]
# MAC distinta por cada red Wi-Fi (estable en esa red): no te pueden rastrear entre redes
wifi.cloned-mac-address = stable
ethernet.cloned-mac-address = stable
# IPv6 con direcciones temporales (no revela la MAC)
ipv6.ip6-privacy = 2
# no anunciar el nombre del equipo al router
ipv4.dhcp-send-hostname = false
ipv6.dhcp-send-hostname = false
