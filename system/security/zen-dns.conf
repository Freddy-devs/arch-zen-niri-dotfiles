# arch-zen-niri — DNS cifrado (systemd-resolved)
# Consultas DNS por TLS a Quad9 (bloquea dominios maliciosos) con Cloudflare de respaldo.
# Solo se usan estos servidores: NetworkManager no pasa el DNS del router (20-zen-privacy.conf).
# "yes": el DNS SIEMPRE va cifrado; nadie en la red puede leerlo ni falsificar respuestas.
# Si una red (hotel, aeropuerto) bloquea DNS-over-TLS, ahí no habrá DNS; para esos casos,
# temporalmente: DNSOverTLS=opportunistic.
# Comprobar:  resolvectl status
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
Domains=~.
DNSOverTLS=yes
MulticastDNS=no
LLMNR=no
