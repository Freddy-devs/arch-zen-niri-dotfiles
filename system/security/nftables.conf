#!/usr/bin/nft -f
# arch-zen-niri — cortafuegos "caja fuerte"
#   ENTRADA:  todo cerrado. Solo pasan respuestas a conexiones que inició la laptop.
#             Sin puertos abiertos, no responde a ping (invisible en la red).
#   SALIDA:   libre (navegar, yay, git, WireGuard...).
#   Acceso remoto: solo por un túnel WireGuard que inicia la laptop (sale, no entra).
# Ver reglas:  sudo nft list ruleset      Registro de bloqueos:  journalctl -k -g zen-fw

flush ruleset

table inet zen_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iif "lo" accept

        # IPv6 no funciona sin descubrimiento de vecinos; sin echo-request (no responde ping)
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert,
                      packet-too-big, destination-unreachable, time-exceeded,
                      parameter-problem } accept
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

        # respuestas DHCPv6 al cliente (DHCPv4 usa sockets raw y no pasa por aquí)
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        limit rate 6/minute burst 10 packets log prefix "zen-fw entrada bloqueada: " level info
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state { established, related } accept
        # contenedores podman (redes puente); el resto no se reenvía
        iifname "podman*" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
