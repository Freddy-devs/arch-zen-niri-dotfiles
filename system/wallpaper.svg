<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- Wallpaper arch-zen-niri: Catppuccin Mocha, columnas inclinadas que evocan el tiling de niri -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="0.55" stop-color="#181825"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="col2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0.01"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.6" fill="#cdd6f4" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#dots)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" fill="url(#glow2)"/>

  <!-- columnas (scrollable tiling) -->
  <g transform="translate(1920 1080) skewX(-14) translate(-1920 -1080)">
    <rect x="1980" y="360" width="380" height="1440" rx="18" fill="url(#col)"/>
    <rect x="2400" y="360" width="560" height="700" rx="18" fill="url(#col2)"/>
    <rect x="2400" y="1100" width="560" height="700" rx="18" fill="url(#col)"/>
    <rect x="3000" y="360" width="260" height="1440" rx="18" fill="url(#col2)"/>
    <rect x="1700" y="360" width="240" height="1440" rx="18" fill="url(#col)" opacity="0.5"/>

    <rect x="1980" y="360" width="380" height="1440" rx="18" fill="none" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="4"/>
    <rect x="2400" y="360" width="560" height="700" rx="18" fill="none" stroke="#45475a" stroke-width="3"/>
    <rect x="2400" y="1100" width="560" height="700" rx="18" fill="none" stroke="#45475a" stroke-width="3"/>
    <rect x="3000" y="360" width="260" height="1440" rx="18" fill="none" stroke="#45475a" stroke-width="3"/>
  </g>

  <!-- línea de horizonte -->
  <rect x="0" y="1990" width="3840" height="3" fill="#89b4fa" fill-opacity="0.18"/>
</svg>
