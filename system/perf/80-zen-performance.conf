# arch-zen-niri — rendimiento y concurrencia (sysctl)

# ---- memoria: zram es barato, se usa antes que soltar caché de archivos
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
# escritura a disco en bloques chicos: el escritorio no se traba al copiar archivos grandes
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# ---- red: BBR + fq (menos latencia y más rendimiento con muchas conexiones)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.ip_local_port_range = 10240 65535

# ---- muchos archivos abiertos / vigilados (IDEs, node, go, rust, podman)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
