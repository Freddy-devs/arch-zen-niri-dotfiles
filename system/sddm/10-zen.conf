# SDDM con el tema Dark Pirate (pantalla de login). El greeter usa X11 solo durante el login;
# la sesión de niri es Wayland.
[Theme]
Current=dark-pirate-sddm-qt6
CursorTheme=Qogir-white-cursors
CursorSize=24

[General]
Numlock=on
# sin teclado en pantalla salvo que se pida
InputMethod=

[Users]
RememberLastUser=true
RememberLastSession=true
