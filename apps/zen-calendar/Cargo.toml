[package]
name = "zen-calendar"
version = "1.0.0"
edition = "2024"
description = "Calendario de la barra: feriados del Perú, agenda y alarmas (GTK4 + layer-shell)"
license = "GPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
